<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Netflix</title>
</head>
<body>
    <header>
        <div class="navbar">
            <div class="nav-items">
            <div class="logo">
                <img src="/Assets/logo.svg" alt="logo">
            </div>
            <a class="sign-in" type="button" href="https://www.netflix.com/za/">Sign In</a>
            </div>
        </div>
        <div class="banner-container">
            <div class="subscribe">
                <h1>Unlimited movies, TV </h1>
                <h1>shows, and more</h1>
                <div>
                    <p>Starts at R 59. Cancel anytime.</p>
                </div>
                <div>
                    <h3>Ready to watch? Enter your email to create or restart your membership.</h3>
                </div>
                <div class="get-started">
                    <input class="email-input" type="text" placeholder="Email address">
                    <button class="get-started-button" type="submit">Get Started ></button>
                    
                </div>
            </div> 
          
        </div>

          <!-- CURVE LINE -->
            <div class="curve">
                <div class="curve-in">
                    <div class="curve-out"></div>
                </div>
            </div>
    </header>
    <main>
            <h2>Trending Now</h2>
            <div class="trending-container">
                <div id="show1" class="shows">
                    <span>1</span>
                </div>
                <div id="show2"class="shows">
                    <span>2</span>
                </div>
                <div id="show3"class="shows">
                    <span>3</span>
                </div>
                <div id="show4"class="shows"> 
                    <span>4</span>
                </div>
                <div id="show5"class="shows">
                    <span>5</span>
                </div>
            </div>
        <h2>More Reasons to Join</h2>
        <div class="reasons-container">
            <div id="reason1" class="reasons">
                <h3>Enjoy on your TV</h3>
            </div>
            <div id="reason2" class="reasons">
                <h3>Download your shows to watch offline</h3>
            </div>
            <div id="reason3" class="reasons">
                <h3>Watch everywhere</h3>
            </div>
            <div id="reason4" class="reasons">
                <h3>Create profiles for kids</h3>
            </div>
        </div>
    </main>
    <footer>

    </footer>
</body>
</html>
